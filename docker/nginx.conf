# Edge reverse proxy (official nginx image), the only service published on the host (port 80).
#   /      -> frontend:8080  (static React SPA)
#   /api/  -> backend:8080   (Go API; the /api prefix is preserved because proxy_pass has no URI)

upstream frontend_upstream { server frontend:8080; }
upstream backend_upstream  { server backend:8080; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
