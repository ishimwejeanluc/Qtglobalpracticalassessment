---
# Preparation shared by every Kubernetes node: kernel, swap, name resolution, kubeadm/kubelet/kubectl.

- name: Resolve every cluster node by name
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - kubernetes nodes"
    block: |
      {% for host in groups['k8s'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: "{{ k8s_kernel_modules | join('\n') }}\n"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"

- name: Kernel networking settings for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ k8s_sysctl | dict2items }}"

- name: Install the Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "{{ k8s_apt_url }}Release.key"
    dest: "{{ k8s_keyring }}"
    mode: "0644"

- name: Add the Kubernetes apt repository (v{{ k8s_version }})
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ k8s_apt_url }}"
    suites: /
    signed_by: "{{ k8s_keyring }}"
  register: k8s_repo

- name: Install kubelet, kubeadm and kubectl v{{ k8s_version }}
  ansible.builtin.apt:
    name: "{{ k8s_packages | map('regex_replace', '$', '=' ~ k8s_version ~ '.*') | list }}"
    state: present
    update_cache: "{{ k8s_repo is changed }}"

- name: Hold Kubernetes packages (no unplanned upgrades)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_packages }}"

- name: Enable the kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
