# EXAMPLE ONLY - placeholder values. Do not put real secrets in this file or in Git.
#
# The real Secret is created by Ansible from docker/.env (git-ignored):
#   cd ansible && ansible-playbook playbooks/k8s-app-prereqs.yml
# The values travel through stdin (never on a command line, never in Helm values or Helm history).
# The charts only reference the Secret by name: existingSecret: projecthub-secrets
#
# To create it by hand instead (for example without Ansible):
#   kubectl create secret generic projecthub-secrets -n qt-spring-app \
#     --from-literal=MONGO_ROOT_USER=projecthub \
#     --from-literal=MONGO_ROOT_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=VALKEY_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: projecthub-secrets
  namespace: qt-spring-app
type: Opaque
stringData:
  MONGO_ROOT_USER: projecthub              # used by: mongodb (root user), api (builds MONGO_URI)
  MONGO_ROOT_PASSWORD: change-me           # used by: mongodb, api
  VALKEY_PASSWORD: change-me               # used by: valkey (--requirepass), api
  JWT_SECRET: change-me-at-least-32-chars  # used by: api (signs login tokens)
