component: api
fullnameOverride: ""

image:
  repository: ishimwejeanluc/projecthub-api
  tag: ""                        # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

replicaCount: 3                  # survives losing a pod; the PDB keeps at least 1
securityContext:
  uid: 10001                     # the image user "app" is not numeric: set one so runAsNonRoot is verifiable

# Secret created outside Helm (from docker/.env): MONGO_ROOT_USER, MONGO_ROOT_PASSWORD, VALKEY_PASSWORD, JWT_SECRET
existingSecret: projecthub-secrets

# Non-secret configuration (ConfigMap)
config:
  ginMode: release
  corsOrigins: "*"
  jwtExpiresIn: 24h
  seedEnabled: "true"
  mongodb:
    host: projecthub-mongodb     # Service of the MongoDB release (same namespace)
    port: 27017
    database: projecthub
    connectTimeout: 90s          # wait for MongoDB on first start (see probes.startup)
  cache:
    enabled: "true"
    host: projecthub-valkey      # Service of the Valkey release
    port: 6379
    statsTTL: 2m
    userTTL: 1m

goMemLimit: 200MiB               # Go soft memory limit, below resources.limits.memory (the "JVM heap" rule)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

probes:
  # 20 x 5s = 100s > config.mongodb.connectTimeout
  startup: { httpGet: { path: /api/health, port: http }, periodSeconds: 5, failureThreshold: 20 }
  readiness: { httpGet: { path: /api/health, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  # Lenient: /api/health returns 503 while MongoDB is down; a short blip must not restart every pod
  liveness: { httpGet: { path: /api/health, port: http }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 6 }

service:
  port: 8080

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false                 # off: it would override the manual "scale to 3" resilience demo
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

topologySpread: true

networkPolicy:
  enabled: true
  port: 8080
  from:
    - component: edge                    # NGINX edge (NodePort entry point)
    - namespace: envoy-gateway-system    # Gateway API proxies
