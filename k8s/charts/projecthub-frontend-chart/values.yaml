component: frontend
fullnameOverride: ""

image:
  repository: ishimwejeanluc/projecthub-frontend
  tag: ""                        # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

replicaCount: 2
securityContext:
  uid: 101                       # nginx user of nginx-unprivileged

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 200m, memory: 64Mi }

probes:
  readiness: { httpGet: { path: /, port: http }, periodSeconds: 10, failureThreshold: 3 }
  liveness: { httpGet: { path: /, port: http }, periodSeconds: 20, failureThreshold: 3 }

service:
  port: 8080

pdb:
  enabled: true
  minAvailable: 1

topologySpread: true

networkPolicy:
  enabled: true
  port: 8080
  from:
    - component: edge
    - namespace: envoy-gateway-system
