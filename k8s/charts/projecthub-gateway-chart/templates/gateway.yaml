apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "projecthub-lib.fullname" . }}
  labels:
    {{- include "projecthub-lib.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "projecthub-lib.fullname" . }}-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.listener.port }}
      allowedRoutes:
        namespaces:
          from: Same
