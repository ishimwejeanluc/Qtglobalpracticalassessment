# /api -> API, everything else -> frontend (same routing as the NGINX edge and Docker Compose)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "projecthub-lib.fullname" . }}
  labels:
    {{- include "projecthub-lib.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "projecthub-lib.fullname" . }}
      sectionName: http
  rules:
    {{- range list .Values.routes.api .Values.routes.frontend }}
    - matches:
        - path: { type: PathPrefix, value: {{ .pathPrefix }} }
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
    {{- end }}
